apiVersion: v1
kind: Service
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  type: ClusterIP
  selector:
    app: taskflow
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-db
  labels:
    app: taskflow-db
spec:
  type: ClusterIP
  selector:
    app: taskflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
