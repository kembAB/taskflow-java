# Postgres profile: used by Docker Compose, Kubernetes, Azure and AWS.
# Activate with SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskflow}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
